name: ci

# Upstream only runs CI on v* tags, so `main` ships unverified: the nine
# workflow runs that exist are all from a single day, and the v0.1.0 one failed.
# Run on every push and PR instead, so a broken main is visible immediately.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # TODO(supply-chain): pin these to commit SHAs rather than tags. Left as
      # tags for now because an unverified SHA is worse than a tag — it silently
      # breaks CI. Enable Dependabot for github-actions and it will pin them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt (changed files only)
        # The tree carries pre-existing formatting drift (struct alignment).
        # Reformatting it wholesale would conflict on every upstream merge, so
        # hold only changed files to the standard.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          changed=$(git diff --name-only "$base" HEAD -- '*.go' | tr '\n' ' ')
          if [ -z "${changed// /}" ]; then echo "no .go changes"; exit 0; fi
          echo "checking: $changed"
          out=$(gofmt -l $changed)
          if [ -n "$out" ]; then echo "not gofmt-clean:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race)
        run: go test ./... -race -count=1

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # check-latest matters here more than anywhere else: without it the
          # runner installs the EXACT patch named in go.mod, and scanning against
          # a stale toolchain reports every stdlib advisory fixed since as
          # reachable. The image is built on the current patch release, so scan
          # what actually ships.
          check-latest: true
      - name: govulncheck
        # `go run` rather than `go install` + a bare binary name: the latter
        # depends on GOPATH/bin being on PATH. GOTOOLCHAIN=auto because setup-go
        # pins the toolchain to the one in go.mod, and x/vuln's own go directive
        # moves ahead of it — without this the tool cannot even be built.
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    # BLOCKING. errcheck is on and the tree passes it: the discarded errors that
    # used to make this job unrunnable (recorder flushes, json encodes,
    # os.Setenv in add-on autodetection) are fixed rather than excluded, so the
    # only errcheck exemptions left are unactionable Close calls. See
    # .golangci.yml. gofmt is deliberately NOT part of this job -- pre-existing
    # formatting drift is held per-change by the gofmt step above instead.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v9+ is required: .golangci.yml uses the v2 config schema, and action v6
      # installs golangci-lint v1, which rejects it outright.
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: a linter that changes under you turns an
          # unrelated PR red, and the gate script has to run the same version or
          # "passes locally" means nothing. Bump deliberately.
          version: v2.13.2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t community-teslafleet:ci .
