name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Standalone slim gateway image (used by docker-compose with separate
      # fleet-telemetry/proxy containers).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Bundled HA add-on image (fleet-telemetry + vehicle-command proxy + gateway).
      - uses: docker/metadata-action@v5
        id: meta_addon
        with:
          images: ghcr.io/${{ github.repository }}-addon
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ha-addon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_addon.outputs.tags }}
          labels: ${{ steps.meta_addon.outputs.labels }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      # The add-on installs the image tag named by `version`, so a tag that
      # does not match it would publish an image nobody gets.
      - name: add-on version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^version: "\(.*\)"$/\1/p' ha-addon/config.yaml)
          test "$got" = "$want" || { echo "ha-addon/config.yaml version is $got, tag is $want"; exit 1; }
