# community-teslafleet: the full stack without Home Assistant's add-on system.
#
#   fleet-telemetry        Tesla's receiver. The car connects to it with mutual
#                          TLS; it passes records to the gateway over ZMQ.
#   vehicle-command-proxy  Signs commands with your private key. Loopback only.
#   gateway                Fleet API and WebSocket for TeslaMate, MQTT for HA.
#
# Ingest needs no MQTT broker. The gateway publishes to your Home Assistant
# broker (TGW_HA_BROKER).
#
# Before starting (see README):
#   - A certificate for the telemetry hostname in ./certs (fullchain.pem,
#     privkey.pem). certbot DNS-01 needs no open port 80.
#   - The public key at https://<domain>/.well-known/appspecific/com.tesla.3p.public-key.pem,
#     on any HTTPS host on your domain.
#   - ./proxy/ with private-key.pem, tls/cert.pem and tls/key.pem. The wizard
#     generates these.
#   - .env, copied from .env.example.

name: community-teslafleet

services:
  fleet-telemetry:
    image: tesla/fleet-telemetry:v0.9.5@sha256:7cb5f429210128b8edc5aac1e403589315893106f4c5a3ff85cb32213e2f8e37
    restart: unless-stopped
    command: ["-config=/etc/fleet-telemetry/config.json"]
    ports:
      - "${TELEMETRY_PORT:-443}:${TELEMETRY_PORT:-443}"   # vehicles connect here (TLS)
    volumes:
      - ./fleet-telemetry-config.json:/etc/fleet-telemetry/config.json:ro
      - ./certs:/etc/certs:ro                              # fullchain.pem + privkey.pem

  vehicle-command-proxy:
    image: tesla/vehicle-command:0.4.1@sha256:e8adac679bf5e72790c588e620bb4a7992a8f80d4c3bd98da6d1129f59daf482
    restart: unless-stopped
    environment:
      - TESLA_HTTP_PROXY_TLS_CERT=/config/tls/cert.pem
      - TESLA_HTTP_PROXY_TLS_KEY=/config/tls/key.pem
      - TESLA_HTTP_PROXY_HOST=0.0.0.0
      - TESLA_HTTP_PROXY_PORT=4443
      - TESLA_HTTP_PROXY_TIMEOUT=30s
      - TESLA_KEY_FILE=/config/private-key.pem
    volumes:
      - ./proxy:/config:ro
    ports:
      - "127.0.0.1:4443:4443"                             # loopback only

  gateway:
    # Or image: ghcr.io/sqmagellan/community-teslafleet:<version>
    build: .
    image: community-teslafleet:local
    restart: unless-stopped
    depends_on: [fleet-telemetry]
    ports:
      - "4460:4460"                                        # Fleet API + WSS for TeslaMate (LAN-only)
      - "127.0.0.1:8099:8099"                              # onboarding wizard, loopback only
    volumes:
      - ./data:/data                                       # config.yaml, token cache, ftc.json, recordings
    environment:
      - TGW_INGEST_ZMQ_ADDR=tcp://fleet-telemetry:5284
      - TGW_INGEST_NAMESPACE=${TELEMETRY_NAMESPACE:-tesla_telemetry}
      - TGW_VINS=${TGW_VINS}
      - TGW_HA_BROKER=${TGW_HA_BROKER}
      - TGW_HA_USERNAME=${TGW_HA_USERNAME:-}
      - TGW_HA_PASSWORD=${TGW_HA_PASSWORD:-}
      - TGW_UNITS_SYSTEM=${TGW_UNITS_SYSTEM:-metric}
      - TGW_FLEETAPI_ENABLED=${TGW_FLEETAPI_ENABLED:-true}
      - TGW_COMMANDS_ENABLED=${TGW_COMMANDS_ENABLED:-true}
      - TGW_ONBOARD_ENABLED=${TGW_ONBOARD_ENABLED:-false}
      - TGW_ONBOARD_PASSWORD=${TGW_ONBOARD_PASSWORD:-}
      - TGW_TESLA_PROXY_URL=https://vehicle-command-proxy:4443
      - TGW_TESLA_CLIENT_ID=${TGW_TESLA_CLIENT_ID:-}
      - TGW_TESLA_CLIENT_SECRET=${TGW_TESLA_CLIENT_SECRET:-}
      - TGW_TESLA_REFRESH_TOKEN=${TGW_TESLA_REFRESH_TOKEN:-}
      - TGW_TESLA_FLEET_API_URL=${TGW_TESLA_FLEET_API_URL:-}
