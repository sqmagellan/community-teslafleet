# golangci-lint configuration.
#
# Deliberately conservative: the goal is a linter that is USEFUL on day one, not
# one that produces hundreds of findings everybody learns to ignore.

version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

  settings:
    errcheck:
      # An unchecked Close on an HTTP response body or a websocket is not
      # actionable: the read has already happened and there is nothing to retry.
      # These are the ONLY exemptions -- every other discarded error is a real
      # finding, and the ones that were hiding real failures (recorder flushes,
      # json encodes, os.Setenv in add-on autodetection) are fixed rather than
      # excluded. Note this is narrower than the std-error-handling exclusion
      # preset, which waives all of .*Close/.*Flush/os.Setenv and would let
      # exactly those regressions back in.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*github.com/gorilla/websocket.Conn).Close

  exclusions:
    rules:
      # Test helpers legitimately ignore errors and shadow names for brevity:
      # a `fmt.Fprint` to an httptest ResponseRecorder cannot fail in a way the
      # test would not already notice.
      - path: _test\.go
        linters:
          - staticcheck
          - errcheck

# No formatters are enabled here on purpose.
#
# The tree carries pre-existing gofmt drift (struct field alignment, in files
# nobody is otherwise touching). Reformatting it wholesale guarantees a conflict
# on every future upstream merge, and leaving gofmt enabled here would mean this
# whole job can never be a required check. Formatting is instead enforced
# PER CHANGE -- the CI gofmt step and hack/gate.sh both hold only the files a
# commit touches, and gate.sh specifically asserts a change adds no new drift.
