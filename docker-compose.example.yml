# Gateway only, for a host that already runs Tesla's fleet-telemetry with a
# zmq dispatcher (see config.example.yaml). docker-compose.yml runs the full stack.
#
# Home Assistant only: set TGW_FLEETAPI_ENABLED=false.
# TeslaMate: set its TESLA_API_HOST to http://<host>:4460.

services:
  gateway:
    # Or image: ghcr.io/sqmagellan/community-teslafleet:<version>
    build: .
    restart: unless-stopped
    ports:
      # Fleet API for TeslaMate. No authentication, and it serves live
      # location, so it binds to loopback. Use "4460:4460" only if TeslaMate
      # runs on another host, and keep it off the internet.
      - "127.0.0.1:4460:4460"
    environment:
      - TGW_INGEST_ZMQ_ADDR=tcp://fleet-telemetry:5284
      - TGW_INGEST_NAMESPACE=tesla_telemetry
      - TGW_FLEETAPI_ENABLED=true
      - TGW_HA_ENABLED=true
      - TGW_HA_BROKER=tcp://homeassistant.local:1883
      # - TGW_HA_USERNAME=...
      # - TGW_HA_PASSWORD=...
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./templates:/templates:ro
