configuration:
  telemetry_port:
    name: Telemetry port
    description: >-
      The port your car connects to from the internet. Forward it on your
      router to Home Assistant. Default 4443. The wizard tells the car which
      port to use.
  namespace:
    name: Telemetry namespace
    description: >-
      Must match the fleet-telemetry namespace. Leave it as tesla_telemetry.
  units_system:
    name: Display units
    description: >-
      metric shows km, °C and bar. imperial shows mi, °F and psi. Display
      only.
  device_identifier:
    name: Entity naming
    description: >-
      name builds entity IDs from the car's name, such as
      sensor.tesla_serenity_battery, and keeps the VIN out of them. vin uses
      the VIN. The VIN is the device serial number either way.
  telemetry_profile:
    name: Streaming frequency
    description: >-
      The profile the wizard's enrollment step starts with. Changing it here
      does not re-enroll the car. eco is the cheapest. balanced stays within
      Tesla's free monthly credit for most setups. live sends the most
      signals. custom leaves the wizard's choice alone.
  fleetapi_enabled:
    name: Serve TeslaMate
    description: >-
      Turn on only if you run TeslaMate. It serves a local Fleet API and
      WebSocket on port 4460 for TeslaMate to read.
  vins:
    name: VIN filter
    description: >-
      Leave empty. Cars are found from the stream. To publish only some cars,
      list their VINs, separated by commas.
  commands_enabled:
    name: Car commands
    description: >-
      Lets Home Assistant control charging, climate, locks, frunk, trunk and
      more. Finish the onboarding wizard and set the client ID first. Off is
      read-only.
  tesla_client_id:
    name: Tesla client ID
    description: >-
      The client ID of your app at developer.tesla.com. Required for commands.
  tesla_client_secret:
    name: Tesla client secret
    description: >-
      The client secret of the same app. Partner registration needs it.
  tesla_refresh_token:
    name: Tesla refresh token
    description: >-
      Only if you did not paste a token in the wizard. Tesla replaces the
      token on every use, and the gateway keeps the current one in /data. You
      can clear this once commands work.
  fleet_api_url:
    name: Fleet API URL
    description: >-
      Your region's Fleet API:
      https://fleet-api.prd.na.vn.cloud.tesla.com for North America and Asia
      Pacific, https://fleet-api.prd.eu.vn.cloud.tesla.com for Europe. Needed
      for partner registration and navigation.
  log_level:
    name: Log level
    description: >-
      info for normal use. debug logs every signal. warn or error once
      everything works.
network:
  "4460/tcp": >-
    Fleet API for TeslaMate. Map it only if TeslaMate runs on another host.
    LAN only; never forward it to the internet.
