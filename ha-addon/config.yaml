# Home Assistant add-on manifest. One container runs fleet-telemetry, the
# vehicle-command proxy and the gateway, which supervises the other two
# (TGW_STREAM_EMBEDDED=true is set in the image). The gateway reads
# /data/options.json and finds the MQTT broker through the Supervisor.
#
# `version` must match the image tag. The release workflow checks it on a tag.
name: Community TeslaFleet
version: "0.2.1"
slug: community_teslafleet
description: Tesla Fleet Telemetry for Home Assistant, with an optional Fleet API for TeslaMate
url: https://github.com/sqmagellan/community-teslafleet
image: ghcr.io/sqmagellan/community-teslafleet-addon
arch:
  - aarch64
  - amd64
init: false
hassio_api: true            # required to read the MQTT service from the Supervisor
services:
  - mqtt:want               # auto-use HA's MQTT broker if present (don't block if absent)
panel_icon: mdi:car-electric
ingress: true               # serve the onboarding wizard in the HA sidebar
ingress_port: 8099
map:
  - type: ssl               # tls_cert and tls_key are read from /ssl
    read_only: true
ports:
  "4443/tcp": 4443          # telemetry, mutual TLS; must be reachable from the internet
  "8098/tcp": 8098          # public key for /.well-known/
  "4460/tcp": null          # Fleet API for TeslaMate, LAN only
ports_description:
  "4443/tcp": Telemetry. The car connects here; forward this port on your router.
  "8098/tcp": Public key. Route https://<domain>/.well-known/ here.
  "4460/tcp": Fleet API for TeslaMate. LAN only; leave unset if you do not use TeslaMate.
# State lives in the add-on's own /data, which HA backups include.
options:
  namespace: "tesla_telemetry"
  units_system: metric
  device_identifier: name
  telemetry_port: 4443
  telemetry_profile: balanced
  fleetapi_enabled: false
  vins: ""
  commands_enabled: false
  tls_cert: fullchain.pem
  tls_key: privkey.pem
  log_level: info
schema:
  namespace: str
  units_system: list(metric|imperial)
  device_identifier: list(name|vin)
  telemetry_port: int(1,65535)
  telemetry_profile: list(eco|balanced|live|custom)
  fleetapi_enabled: bool
  vins: str
  commands_enabled: bool
  tesla_client_id: str?
  tesla_client_secret: password?
  tesla_refresh_token: password?
  fleet_api_url: url?
  tls_cert: str?
  tls_key: str?
  log_level: list(debug|info|warn|error)
