# community-teslafleet example configuration. Copy to config.yaml.
# Every setting can also come from a TGW_* environment variable, which wins.
#   Home Assistant only: fleetapi.enabled: false
#   Also TeslaMate:      fleetapi.enabled: true

# Ingest needs no broker. In the fleet-telemetry config, send V and
# connectivity records to a "zmq" dispatcher with transmit_decoded_records: true
# and addr tcp://0.0.0.0:5284. The gateway connects to it.
ingest:
  zmq_addr: "tcp://fleet-telemetry:5284"  # TGW_INGEST_ZMQ_ADDR
  namespace: "tesla_telemetry"            # TGW_INGEST_NAMESPACE (fleet-telemetry namespace)

# Fleet API emulator (TeslaMate sets TESLA_API_HOST to this service).
fleetapi:
  enabled: true                       # TGW_FLEETAPI_ENABLED

http:
  listen: ":4460"                     # TGW_HTTP_LISTEN

# Home Assistant MQTT discovery.
ha:
  enabled: true                       # TGW_HA_ENABLED
  broker: ""                          # TGW_HA_BROKER, e.g. tcp://homeassistant.local:1883
  username: ""
  password: ""
  discovery_prefix: "homeassistant"
  state_topic_base: "tgw"

# The units your car streams. vehicle_data for TeslaMate is always in miles,
# so these must be right. Check once against the Tesla app.
units:
  range_input: "km"      # km | mi
  speed_input: "kmh"     # kmh | mph
  odometer_input: "km"   # km | mi

# Commands from Home Assistant, signed by the vehicle-command proxy. Requires
# ha.enabled and a refresh token with the vehicle_cmds scope. The gateway keeps
# the token current; the value here only seeds it.
commands:
  enabled: false                          # TGW_COMMANDS_ENABLED
  proxy_url: "https://vehicle-command-proxy:4443"  # tesla/vehicle-command proxy
  auth_host: "https://auth.tesla.com"
  auth_path: "/oauth2/v3"
  client_id: ""                           # TGW_TESLA_CLIENT_ID
  client_secret: ""                       # TGW_TESLA_CLIENT_SECRET; prefer TGW_TESLA_CLIENT_SECRET_FILE
  refresh_token: ""                       # TGW_TESLA_REFRESH_TOKEN; prefer the _FILE form

state:
  stale_after_seconds: 660       # no telemetry this long: may report asleep
  online_grace_seconds: 60
  report_asleep_when_idle: false # true reports asleep when idle, even if Sentry keeps the modem online

log_level: "info"        # debug | info | warn | error

vehicles:
  - vin: "5YJ3XXXXXXXXXXXXX"
    display_name: "My Tesla"
    template: "/templates/5YJ3XXXXXXXXXXXXX.json"   # captured vehicle_data (see templates/README.md)
    # id and vehicle_id come from the VIN when omitted.
